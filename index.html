<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090d"><title>Vênus.AI</title><style>
:root{color-scheme:dark;--bg:#09090d;--panel:#111118;--panel2:#17151f;--line:#282531;--text:#f5f3fa;--muted:#9a96a7;--purple:#a78bfa;--pink:#f0a5c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app-shell{display:flex;min-height:100vh}.sidebar{width:235px;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;flex-shrink:0;background:#0c0b11}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:750;margin:4px 8px 30px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#a78bfa,#e5a1c4);color:#17111e;font-weight:900}.muted{color:var(--muted)}.nav{width:100%;border:0;background:transparent;color:#bdb8c8;padding:12px 14px;text-align:left;border-radius:11px;display:flex;gap:12px;align-items:center;cursor:pointer;font-size:15px;margin:3px 0}.nav:hover,.nav.active{background:#211c2c;color:#fff}.nav.active{box-shadow:inset 2px 0 var(--purple)}.side-bottom{margin-top:auto}.profile{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:18px 5px 0;margin-top:18px}.profile small{display:block;color:var(--muted)}.avatar{background:linear-gradient(135deg,#a78bfa,#d889b8);color:#24152d;border-radius:50%;display:grid;place-items:center;font-weight:800}.avatar.small{width:34px;height:34px}.main{flex:1;min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;background:#09090de8;backdrop-filter:blur(12px);z-index:2}.top-title{font-weight:650}.create-btn,.primary{border:0;background:linear-gradient(110deg,#a78bfa,#d991bd);color:#1a1221;font-weight:700;border-radius:10px;padding:10px 15px;cursor:pointer}.mobile-menu{display:none;background:transparent;border:0;color:inherit;font-size:20px}#content{max-width:1250px;margin:auto;padding:30px}.hero{border:1px solid #2a2436;background:radial-gradient(ellipse at top right,#30213c 0,#16121e 45%,#111018 100%);border-radius:20px;padding:36px 34px;margin-bottom:28px}.hero h1{font-size:clamp(27px,4vw,42px);line-height:1.15;margin:0 0 12px;letter-spacing:-.04em}.hero p{color:#b7afc5;max-width:570px;margin:0 0 22px}.search{width:100%;background:#15131b;border:1px solid var(--line);padding:13px 15px;border-radius:12px;color:inherit;margin:0 0 22px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 14px}.section-head h2{font-size:20px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--line);background:#121119;color:#bdb6c8;border-radius:999px;padding:7px 13px;cursor:pointer}.chip.active{background:#2b2039;color:#e5d8ff;border-color:#604a7b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden;cursor:pointer;transition:.18s transform,.18s border-color}.card:hover{transform:translateY(-3px);border-color:#625075}.cover{height:185px;display:grid;place-items:center;background:linear-gradient(135deg,#2d1f3d,#13121a);font-size:64px;position:relative}.cover .badge{position:absolute;left:12px;top:12px;font-size:11px;background:#0c0b11bd;padding:5px 8px;border-radius:30px;color:#d8c7fa}.card-body{padding:13px 14px}.card-body h3{margin:0 0 4px;font-size:16px}.card-body p{color:var(--muted);font-size:13px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}.tag{font-size:11px;color:#c8b4e9;background:#211a2c;padding:4px 7px;border-radius:6px}.empty{padding:45px 20px;text-align:center;color:var(--muted);border:1px dashed #393340;border-radius:16px}.form-wrap{max-width:850px;margin:auto}.form-wrap h1{font-size:30px;margin:0 0 6px}.form-wrap .intro{color:var(--muted);margin:0 0 24px}.panel{border:1px solid var(--line);background:var(--panel);padding:20px;border-radius:16px;margin:15px 0}.label{display:block;font-weight:650;margin:14px 0 7px}.field,textarea,select{width:100%;border:1px solid #34303d;background:#0d0c12;color:var(--text);border-radius:10px;padding:12px;font:inherit;outline:none}.field:focus,textarea:focus{border-color:#8f72be}textarea{resize:vertical;min-height:110px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode-tabs{display:flex;gap:8px;margin:15px 0}.mode-tabs button{flex:1;border:1px solid var(--line);background:#131119;color:var(--muted);padding:12px;border-radius:10px;cursor:pointer}.mode-tabs button.active{border-color:#8261a9;background:#261d32;color:#e5d5ff}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.secondary{background:#25212d;color:#ddd;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}.chat-view{max-width:900px;margin:0 auto;height:calc(100vh - 135px);display:flex;flex-direction:column}.chat-head{display:flex;gap:14px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.chat-head .cover{height:55px;width:55px;border-radius:13px;font-size:28px}.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:75%;padding:12px 15px;border-radius:15px;background:#191620;border:1px solid #2c2934;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:#332541;border-color:#514063}.chat-compose{display:flex;gap:9px;padding:12px;border-top:1px solid var(--line)}.chat-compose input{flex:1}.small-note{color:var(--muted);font-size:12px;margin-top:8px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#282331;border:1px solid #4b3c58;padding:11px 17px;border-radius:12px;z-index:5}.heart{float:right;background:none;border:0;color:#e6a2c6;cursor:pointer;font-size:20px}.danger{color:#f4a6ad}@media(max-width:760px){.sidebar{display:none;position:fixed;inset:0 auto 0 0;z-index:5;width:245px}.sidebar.open{display:flex}.topbar{padding:0 16px;height:65px}.mobile-menu{display:block}.top-title{font-size:14px}#content{padding:17px}.hero{padding:24px 20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.cover{height:150px}.card-body{padding:11px}.card-body h3{font-size:14px}.two{grid-template-columns:1fr}.chat-view{height:calc(100vh - 100px)}}

</style></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">V</span><span>Vênus<span class="muted">.AI</span></span></div><button class="nav active" data-view="discover">⌕ <span>Explorar</span></button><button class="nav" data-view="my">▣ <span>Meus personagens</span></button><button class="nav" data-view="favorites">♡ <span>Favoritos</span></button><div class="side-bottom"><button class="nav" data-view="create">＋ <span>Criar personagem</span></button><div class="profile"><div class="avatar small">VL</div><div><strong>Seu espaço</strong><small>Biblioteca local</small></div></div></div></aside><main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><div class="top-title">Seu universo de personagens</div><button class="create-btn" data-view="create">＋ Criar</button></header><section id="content"></section></main></div><div id="modal-root"></div><script>
const KEY='venus.ai.characters.v1';let characters=JSON.parse(localStorage.getItem(KEY)||'[]');let favorites=JSON.parse(localStorage.getItem(KEY+'.favorites')||'[]');let currentFilter='Todos';let activeChat=null;let view='discover';const content=document.getElementById('content');const modalRoot=document.getElementById('modal-root');const categories=['Todos','Romance','Fantasia','Aventura','Drama','Amizade','Sci-fi'];const sample=[];function save(){localStorage.setItem(KEY,JSON.stringify(characters));localStorage.setItem(KEY+'.favorites',JSON.stringify(favorites))}function escapeHtml(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function avatar(c){return c.emoji||'✦'}function render(){if(view==='create'){renderForm();return}if(view==='chat'){renderChat();return}let list=view==='my'?characters:view==='favorites'?characters.filter(c=>favorites.includes(c.id)):characters;let title=view==='my'?'Meus personagens':view==='favorites'?'Favoritos':'Personagens em destaque';let cards=list.filter(c=>(currentFilter==='Todos'||(c.category||'').toLowerCase().includes(currentFilter.toLowerCase()))).map(c=>card(c)).join('');content.innerHTML=`${view==='discover'?`<section class="hero"><h1>Histórias que começam<br>com você.</h1><p>Explore personagens, crie conexões e mergulhe em conversas onde sua imaginação é o limite.</p><button class="primary" data-view="create">＋ Criar seu personagem</button></section>`:''}<input class="search" id="search" placeholder="⌕  Buscar personagens..."/><div class="section-head"><h2>${title}</h2><span class="muted">${list.length} personagem(ns)</span></div><div class="filters">${categories.map(x=>`<button class="chip ${currentFilter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="grid" id="cards">${cards||`<div class="empty" style="grid-column:1/-1">${view==='favorites'?'Você ainda não favoritou personagens.':'Sua biblioteca está vazia por enquanto.'}<br><button class="primary" data-view="create" style="margin-top:14px">Criar personagem</button></div>`}</div>`;document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase();document.getElementById('cards').innerHTML=list.filter(c=>(currentFilter==='Todos'||(c.category||'').toLowerCase().includes(currentFilter.toLowerCase()))&&(c.name+' '+c.description+' '+(c.tags||[]).join(' ')).toLowerCase().includes(q)).map(card).join('')||'<div class="empty" style="grid-column:1/-1">Nenhum personagem encontrado.</div>'};bindCardActions()}
function card(c){return `<article class="card" data-open="${c.id}"><div class="cover">${avatar(c)}<span class="badge">${escapeHtml(c.category||'Personagem')}</span></div><div class="card-body"><button class="heart" data-fav="${c.id}" aria-label="Favoritar">${favorites.includes(c.id)?'♥':'♡'}</button><h3>${escapeHtml(c.name)}</h3><p>${escapeHtml(c.description||c.personality||'Um personagem esperando por uma história.')}</p><div class="tags">${(c.tags||[]).slice(0,3).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div></div></article>`}
function bindCardActions(){document.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-fav]'))return;let c=characters.find(x=>x.id===el.dataset.open);if(c){activeChat=c;view='chat';render()}});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();let id=b.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;render()})}
function renderForm(editId=null){let old=characters.find(c=>c.id===editId);content.innerHTML=`<div class="form-wrap"><h1>${old?'Editar personagem':'Criar personagem'}</h1><p class="intro">Dê vida a alguém que você gostaria de conhecer.</p><div class="mode-tabs"><button class="active" id="quick">Criação rápida</button><button id="full">Criação completa</button></div><form id="characterForm"><div class="panel"><div class="two"><div><label class="label">Nome *</label><input class="field" name="name" required maxlength="80" value="${escapeHtml(old?.name||'')}" placeholder="Nome do personagem"></div><div><label class="label">Categoria</label><select class="field" name="category">${['Romance','Fantasia','Aventura','Drama','Amizade','Sci-fi','Outro'].map(x=>`<option ${old?.category===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="two"><div><label class="label">Emoji / avatar temporário</label><input class="field" name="emoji" maxlength="8" value="${escapeHtml(old?.emoji||'✨')}" placeholder="✨"></div><div><label class="label">Tags (separadas por vírgula)</label><input class="field" name="tags" value="${escapeHtml((old?.tags||[]).join(', '))}" placeholder="gentil, misterioso, intenso"></div></div><label class="label">Descrição e personalidade (campo principal) *</label><textarea name="description" required rows="6" placeholder="Descreva completamente o personagem: personalidade, aparência, história, jeito de falar, desejos, limites, cenário...">${escapeHtml(old?.description||old?.personality||'')}</textarea><label class="label">Mensagem inicial</label><textarea name="greeting" rows="3" placeholder="Como ele/ela inicia a conversa?">${escapeHtml(old?.greeting||'')}</textarea><div id="advanced" hidden><label class="label">História / contexto</label><textarea name="backstory" placeholder="Passado, relações, mundo, acontecimentos...">${escapeHtml(old?.backstory||'')}</textarea><label class="label">Instruções adicionais de comportamento</label><textarea name="instructions" placeholder="Regras de interpretação, estilo, coisas que deve lembrar...">${escapeHtml(old?.instructions||'')}</textarea><label class="label">Aparência detalhada</label><textarea name="appearance" placeholder="Detalhes físicos e estilo...">${escapeHtml(old?.appearance||'')}</textarea></div></div><div class="form-actions"><button type="button" class="secondary" data-view="${old?'my':'discover'}">Cancelar</button><button class="primary" type="submit">${old?'Salvar alterações':'Salvar personagem'}</button></div></form></div>`;let advanced=false;document.getElementById('quick').onclick=()=>{advanced=false;document.getElementById('advanced').hidden=true;document.getElementById('quick').classList.add('active');document.getElementById('full').classList.remove('active')};document.getElementById('full').onclick=()=>{advanced=true;document.getElementById('advanced').hidden=false;document.getElementById('full').classList.add('active');document.getElementById('quick').classList.remove('active')};document.getElementById('characterForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:old?.id||crypto.randomUUID(),name:f.get('name').trim(),category:f.get('category'),emoji:f.get('emoji')||'✨',tags:f.get('tags').split(',').map(x=>x.trim()).filter(Boolean),description:f.get('description').trim(),greeting:f.get('greeting').trim(),backstory:f.get('backstory')||'',instructions:f.get('instructions')||'',appearance:f.get('appearance')||'',created:old?.created||Date.now()};if(old)characters=characters.map(x=>x.id===old.id?obj:x);else characters.unshift(obj);save();view=old?'my':'discover';toast('Personagem salvo!');render()};bindViews()}
function renderChat(){let c=activeChat;if(!c){view='discover';render();return}content.innerHTML=`<div class="chat-view"><div class="chat-head"><div class="cover">${avatar(c)}</div><div><strong>${escapeHtml(c.name)}</strong><div class="muted">${escapeHtml(c.category||'Personagem')}</div></div><button class="secondary" id="editCharacter">Editar</button></div><div class="messages" id="messages"><div class="bubble">${escapeHtml(c.greeting||`Olá! Eu sou ${c.name}. Como começa nossa história?`)}</div></div><div class="chat-compose"><input class="field" id="chatInput" placeholder="Escreva sua mensagem..."/><button class="primary" id="send">Enviar</button></div><p class="small-note" style="padding:0 12px">Modo de conversa local demonstrativo. Para respostas reais de IA, conectaremos um provedor e uma chave API segura no servidor.</p></div>`;document.getElementById('editCharacter').onclick=()=>renderForm(c.id);let send=()=>{let inp=document.getElementById('chatInput'),text=inp.value.trim();if(!text)return;let box=document.getElementById('messages');box.insertAdjacentHTML('beforeend',`<div class="bubble user">${escapeHtml(text)}</div><div class="bubble">${escapeHtml(c.name)} está pronto para conversar. A conexão com IA ainda não foi configurada. Sua mensagem: “${escapeHtml(text.slice(0,180))}”</div>`);inp.value='';box.scrollTop=box.scrollHeight};document.getElementById('send').onclick=send;document.getElementById('chatInput').onkeydown=e=>{if(e.key==='Enter')send()};bindViews()}
function toast(s){let el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2300)}function bindViews(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;activeChat=null;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===view));render();document.querySelector('.sidebar').classList.remove('open')})}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;activeChat=null;render();document.querySelector('.sidebar').classList.remove('open')});document.getElementById('mobileMenu').onclick=()=>document.querySelector('.sidebar').classList.toggle('open');render();

</script></body></html>
